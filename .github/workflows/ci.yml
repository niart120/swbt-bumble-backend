name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: cargo test --all-targets --locked

  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked

  msrv:
    name: Rust 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.87.0 --profile minimal --no-self-update
      - run: cargo +1.87.0 check --locked
      - run: cargo +1.87.0 test --all-targets --locked

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: cargo package --locked
