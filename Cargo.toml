[package]
name = "swbt-bumble-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["The bumble-rs contributors", "niart120"]
description = "Bluetooth Classic HID backend extracted for swbt-rs"
repository = "https://github.com/niart120/swbt-bumble-backend"
documentation = "https://docs.rs/swbt-bumble-backend"
readme = "README.md"
keywords = ["bluetooth", "classic", "hid", "hci"]
categories = ["hardware-support"]
publish = true
include = [
    "src/**",
    "tests/**",
    "CHANGELOG.md",
    "PROVENANCE.md",
    "README.md",
    "SECURITY.md",
    "LICENSE",
    "NOTICE",
]

[dependencies]
rusb = { version = "0.9.4", features = ["vendored"] }

[lints.rust]
unsafe_code = "forbid"
